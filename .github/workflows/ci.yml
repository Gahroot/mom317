name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    # Static site: no package manifest, so there is no install, build or test script.
    # This job runs the type check documented in site/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Type-check site scripts
        working-directory: site
        run: npx --yes -p typescript@5.9.3 tsc --noEmit --allowJs --checkJs --target es2019 --lib es2019,dom,dom.iterable globals.d.ts config.js app.js thanks.js

      - name: Blog build tests
        run: node --test tools/

      - name: Engine tests (including carousel guards)
        working-directory: engine
        run: npm ci && npm test

      - name: Blog output is up to date
        run: node tools/build-blog.mjs --check
